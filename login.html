<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Access Your Account</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #0f172a, #1e1b4b, #020617);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Glow Effect */
        .bg-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.35;
            z-index: 0;
            animation: pulse 8s infinite alternate;
        }

        .glow-1 { top: 15%; right: 15%; }
        .glow-2 { bottom: 15%; left: 15%; background: linear-gradient(135deg, #818cf8, #c084fc); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.25; }
            100% { transform: scale(1.2); opacity: 0.45; }
        }

        /* Glassmorphism Card */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .card-header h2 {
            font-size: 1.8rem;
            color: #f8fafc;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .card-header p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 6px;
        }

        /* Form Elements Vertically Stacked */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 16px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            background: rgba(15, 23, 42, 0.85);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Footer Link */
        .card-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .card-footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .card-footer a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        /* Message Box */
        .msg-box {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .msg-error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #fca5a5;
        }
    </style>
</head>
<body>

    <!-- Background Glow Effect -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Login Card -->
    <div class="login-card">
        <div class="card-header">
            <h2>Welcome Back</h2>
            <p>Please enter your credentials to login</p>
        </div>

        <div id="loginMsgBox" class="msg-box msg-error"></div>

        <form id="loginForm">
            <!-- Email Address -->
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="john.doe@example.com" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>

        <div class="card-footer">
            Don't have an account? <a href="registration.html">Register Here</a>
        </div>
    </div>

    <!-- External JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
