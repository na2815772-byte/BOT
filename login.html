<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>লগইন</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color: white;
}

.card {
    width: 90%;
    max-width: 420px;
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    border: 1px solid #334155;
    box-shadow: 0 15px 40px rgba(0,0,0,.4);
}

h1 {
    text-align: center;
    color: #38bdf8;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #0284c7;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0369a1;
}

.register {
    text-align: center;
    margin-top: 20px;
}

.register a {
    color: #38bdf8;
}

.message {
    margin-top: 15px;
    text-align: center;
}

</style>

</head>

<body>

<div class="card">

    <h1>লগইন</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="আপনার Gmail / Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="পাসওয়ার্ড"
            required>

        <button type="submit">
            লগইন
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">

        অ্যাকাউন্ট নেই?

        <a href="registration.html">
            রেজিস্ট্রেশন করুন
        </a>

    </div>

</div>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    const savedUser =
        JSON.parse(localStorage.getItem("registeredUser"));


    if (!savedUser) {

        document.getElementById("message").innerText =
            "আগে রেজিস্ট্রেশন করুন।";

        return;
    }


    if (
        email === savedUser.email &&
        password === savedUser.password
    ) {

        /*
         * LOGIN SUCCESS
         */

        localStorage.setItem(
            "isLoggedIn",
            "true"
        );


        /*
         * Home page
         */

        window.location.href = "index.html";

    } else {

        document.getElementById("message").innerText =
            "Email অথবা Password সঠিক নয়।";

    }

});

</script>

</body>
</html>
