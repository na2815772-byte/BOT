<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>মাই অ্যাপ - Home</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, .9);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
        }

        /* THREE LINE */

        .menu-container {
            position: relative;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            line-height: 1;
        }

        .dropdown {
            position: absolute;
            top: 45px;
            left: 0;
            width: 190px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
        }

        .dropdown a,
        .dropdown button {
            display: block;
            width: 100%;
            padding: 14px 16px;
            border: none;
            background: transparent;
            color: white;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
        }

        .dropdown a:hover,
        .dropdown button:hover {
            background: #334155;
            color: #38bdf8;
        }

        /* LOGIN / REGISTRATION */

        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link {
            background: #0284c7;
            padding: 9px 14px;
            border-radius: 7px;
        }

        /* MAIN */

        .main-container {
            max-width: 800px;
            margin: 55px auto;
            padding: 20px;
        }

        .hero-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 55px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }

        .hero-card h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .hero-card p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .get-started {
            border: none;
            border-radius: 50px;
            padding: 17px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            box-shadow: 0 5px 20px rgba(2,132,199,.4);
        }

        .get-started:hover {
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        @media(max-width:600px) {

            .navbar {
                padding: 14px 12px;
            }

            .logo-text {
                font-size: 1.2rem;
            }

            .nav-right {
                gap: 9px;
            }

            .nav-link {
                font-size: 14px;
            }

            .register-link {
                padding: 8px 10px;
            }

            .hero-card h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="nav-left">

        <!-- THREE LINE MENU -->
        <div class="menu-container">

            <button id="menuBtn" class="menu-btn">
                ☰
            </button>

            <div id="dropdownMenu" class="dropdown hidden">

                <!-- সবসময় থাকবে -->
                <a href="#" id="helpBtn">
                    হেল্প সেন্টার
                </a>

                <!-- শুধু Login করলে দেখা যাবে -->
                <button id="logoutBtn" class="hidden">
                    লগআউট
                </button>

            </div>

        </div>

        <span class="logo-text">
            মাই অ্যাপ
        </span>

    </div>


    <!-- Logged Out অবস্থায় এগুলো থাকবে -->
    <div id="authLinks" class="nav-right">

        <a href="login.html" class="nav-link">
            লগইন
        </a>

        <a href="registration.html"
           class="nav-link register-link">
            রেজিস্ট্রেশন
        </a>

    </div>

</header>


<main class="main-container">

    <section class="hero-card">

        <h1>
            স্বাগতম আমাদের প্ল্যাটফর্মে
        </h1>

        <p>
            শুরু করতে নিচের বাটনে ক্লিক করুন
        </p>

        <button id="getStartedBtn"
                class="get-started">
            Get Started
        </button>

    </section>

</main>


<script>

    /* =========================
       LOGIN STATUS
    ========================== */

    function checkLogin() {
        return localStorage.getItem("isLoggedIn") === "true";
    }


    const menuBtn =
        document.getElementById("menuBtn");

    const dropdownMenu =
        document.getElementById("dropdownMenu");

    const authLinks =
        document.getElementById("authLinks");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const getStartedBtn =
        document.getElementById("getStartedBtn");


    /* =========================
       UPDATE HOME
    ========================== */

    function updateHome() {

        const loggedIn = checkLogin();

        if (loggedIn) {

            /* Login + Registration Hide */

            authLinks.classList.add("hidden");

            /* Logout Show */

            logoutBtn.classList.remove("hidden");

        } else {

            /* Login + Registration Show */

            authLinks.classList.remove("hidden");

            /* Logout Hide */

            logoutBtn.classList.add("hidden");
        }
    }


    updateHome();


    /* =========================
       THREE LINE MENU
    ========================== */

    menuBtn.addEventListener("click", function () {

        dropdownMenu.classList.toggle("hidden");

    });


    /* =========================
       HELP CENTER
    ========================== */

    document
        .getElementById("helpBtn")
        .addEventListener("click", function(e) {

            e.preventDefault();

            alert("Help Center");

        });


    /* =========================
       LOGOUT
    ========================== */

    logoutBtn.addEventListener("click", function () {

        localStorage.removeItem("isLoggedIn");

        /* Login page */

        window.location.href = "login.html";

    });


    /* =========================
       GET STARTED
    ========================== */

    getStartedBtn.addEventListener("click", function () {

        if (checkLogin()) {

            /*
             * Logged In
             * → Record Page
             */

            window.location.href = "record.html";

        } else {

            /*
             * New / Logged Out user
             * → Login Page
             */

            window.location.href = "login.html";

        }

    });

</script>

</body>
</html>
