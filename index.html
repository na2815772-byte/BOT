<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হোম পেজ - ভয়েস ও বট সার্ভিস</title>
    <style>
        /* মূল স্টাইল ও কালার থিম */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* নেভিগেশন বার */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        /* থ্রি-ডট ড্রপডাউন মেনু */
        .menu-container {
            position: relative;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #f8fafc;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0 5px;
            transition: color 0.3s;
            line-height: 1;
        }

        .icon-btn:hover {
            color: #38bdf8;
        }

        .dropdown-content {
            position: absolute;
            left: 0;
            top: 130%;
            background-color: #1e293b;
            min-width: 170px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .dropdown-content a, .dropdown-item-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            color: #f8fafc;
            text-decoration: none;
            text-align: left;
            background: none;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .dropdown-content a:hover, .dropdown-item-btn:hover {
            background-color: #334155;
            color: #38bdf8;
        }

        /* বাটনের স্টাইল */
        .nav-link {
            color: #f8fafc;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #38bdf8;
        }

        .btn-primary-sm {
            background-color: #0284c7;
            padding: 8px 16px;
            border-radius: 6px;
            color: #fff !important;
            transition: background 0.3s;
        }

        .btn-primary-sm:hover {
            background-color: #0369a1;
        }

        .btn-large {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }

        .btn-action {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: #047857;
        }

        .btn-danger {
            background-color: #dc2626;
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }

        .btn-action:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-primary {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #0369a1;
        }

        /* মূল কনটেন্ট লেআউট */
        .main-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex-grow: 1;
        }

        .hero-card, .bot-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .hero-card h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        .hero-card p {
            color: #94a3b8;
            margin-bottom: 28px;
            font-size: 1.1rem;
        }

        .bot-card h2 {
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .record-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        /* অ্যানিমেটেড ভয়েস ভিজ্যুয়াল ইফেক্ট (Wave Effect) */
        .visualizer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            height: 40px;
            margin-bottom: 20px;
        }

        .wave-bar {
            width: 6px;
            height: 10px;
            background-color: #38bdf8;
            border-radius: 3px;
            transition: height 0.2s ease;
        }

        .recording .wave-bar {
            animation: pulse 1s infinite alternate ease-in-out;
        }

        .recording .wave-bar:nth-child(1) { animation-delay: 0.1s; }
        .recording .wave-bar:nth-child(2) { animation-delay: 0.3s; }
        .recording .wave-bar:nth-child(3) { animation-delay: 0.5s; }
        .recording .wave-bar:nth-child(4) { animation-delay: 0.2s; }
        .recording .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes pulse {
            0% { height: 8px; opacity: 0.5; }
            100% { height: 35px; opacity: 1; background-color: #22c55e; }
        }

        .input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px;
            color: #f8fafc;
            font-size: 1rem;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        .response-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            border-radius: 4px;
            text-align: left;
        }

        .response-box h3 {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        /* হাইড করার ক্লাস */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <header class="navbar">
        <div class="nav-left">
            <!-- থ্রি-ডট আইকন ও ড্রপডাউন মেনু -->
            <div class="menu-container">
                <button id="menuBtn" class="icon-btn" aria-label="Menu">&#8942;</button>
                <div id="dropdownMenu" class="dropdown-content hidden">
                    <a href="#" id="helpCenterBtn">হেল্প সেন্টার</a>
                    <button id="logoutBtn" class="dropdown-item-btn hidden">লগআউট</button>
                </div>
            </div>
            <span class="logo-text">মাই অ্যাপ</span>
        </div>
        <div class="nav-right" id="navAuthLinks">
            <a href="login.html" class="nav-link">লগইন</a>
            <a href="registration.html" class="nav-link btn-primary-sm">রেজিস্ট্রেশন</a>
        </div>
    </header>

    <!-- মূল কনটেন্ট -->
    <main class="main-container">
        
        <!-- গেট স্টার্টেড সেকশন -->
        <section id="heroSection" class="hero-card">
            <h1>স্বাগতম আমাদের প্ল্যাটফর্মে</h1>
            <p>শুরু করতে নিচের বাটনে ক্লিক করুন</p>
            <button id="getStartedBtn" class="btn-large">Get Started</button>
        </section>

        <!-- বট / রেকর্ড সেকশন (Get Started-এ ক্লিক করার পর দৃশ্যমান হবে) -->
        <section id="botSection" class="bot-card hidden">
            <h2>ভয়েস ও টেক্সট সহকারী</h2>
            
            <!-- ভয়েস ভিজ্যুয়াল ইফেক্ট -->
            <div id="visualizer" class="visualizer-container">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>

            <div class="record-controls">
                <button id="startRecordBtn" class="btn-action">Start Record</button>
                <button id="stopRecordBtn" class="btn-action btn-danger" disabled>Stop Record</button>
            </div>

            <div class="input-container">
                <textarea id="userInputText" placeholder="আপনার প্রশ্ন বা বার্তা এখানে লিখুন..." rows="4"></textarea>
                <button id="submitBtn" class="btn-primary">সাবমিট</button>
            </div>

            <!-- বটের রেসপন্স এলাকা -->
            <div id="botResponseArea" class="response-box hidden">
                <h3>উত্তর:</h3>
                <p id="responseText"></p>
            </div>
        </section>

    </main>

    <script>
        // বিশ্বস্ত স্ট্যাটাস ম্যানেজমেন্ট
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        let recognition = null;
        let recordedSpeechText = "";

        const navAuthLinks = document.getElementById('navAuthLinks');
        const logoutBtn = document.getElementById('logoutBtn');
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        
        const heroSection = document.getElementById('heroSection');
        const botSection = document.getElementById('botSection');
        const getStartedBtn = document.getElementById('getStartedBtn');
        
        const startRecordBtn = document.getElementById('startRecordBtn');
        const stopRecordBtn = document.getElementById('stopRecordBtn');
        const userInputText = document.getElementById('userInputText');
        const submitBtn = document.getElementById('submitBtn');
        const visualizer = document.getElementById('visualizer');
        const botResponseArea = document.getElementById('botResponseArea');
        const responseText = document.getElementById('responseText');

        // ১. নেভবার এবং লগইন স্টেট সেটআপ
        if (isLoggedIn) {
            navAuthLinks.classList.add('hidden');
            logoutBtn.classList.remove('hidden');
        } else {
            navAuthLinks.classList.remove('hidden');
            logoutBtn.classList.add('hidden');
        }

        // ড্রপডাউন টগল
        menuBtn.addEventListener('click', () => {
            dropdownMenu.classList.toggle('hidden');
        });

        // লগআউট ক্লিক
        logoutBtn.addEventListener('click', () => {
            localStorage.setItem('isLoggedIn', 'false');
            window.location.href = 'login.html';
        });

        // ২. ভয়েস স্পিচ স্পিকার ফাংশন (1.5x Speed)
        function speakVoice(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.5;
            window.speechSynthesis.speak(utterance);
        }

        // ৩. Get Started বাটন ক্লিক লজিক
        getStartedBtn.addEventListener('click', () => {
            if (!isLoggedIn) {
                speakVoice("Please complete your registration first, then return to the home page.");
                window.location.href = 'login.html';
            } else {
                heroSection.classList.add('hidden');
                botSection.classList.remove('hidden');
            }
        });

        // ৪. ব্যাকগ্রাউন্ড স্পিচ রিকগনিশন (অডিও থেকে লুকানো টেক্সট)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';
            recognition.continuous = true;

            recognition.onresult = (event) => {
                let currentText = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentText += event.results[i][0].transcript;
                }
                recordedSpeechText = currentText; // ব্যাকগ্রাউন্ডে সেভ হবে
            };
        }

        // রেকর্ড স্টার্ট
        startRecordBtn.addEventListener('click', () => {
            if (!recognition) {
                alert("আপনার ব্রাউজারে ভয়েস রেকর্ডিং সাপোর্ট করে না।");
                return;
            }
            recordedSpeechText = "";
            recognition.start();
            visualizer.classList.add('recording');
            startRecordBtn.disabled = true;
            stopRecordBtn.disabled = false;
        });

        // রেকর্ড স্টপ
        stopRecordBtn.addEventListener('click', () => {
            if (recognition) {
                recognition.stop();
            }
            visualizer.classList.remove('recording');
            startRecordBtn.disabled = false;
            stopRecordBtn.disabled = true;
        });

        // ৫. সাবমিট লজিক (ভয়েস ও টেক্সট কম্বাইন্ড)
        submitBtn.addEventListener('click', () => {
            // যদি ভয়েস রেকর্ড করা থাকে তাহলে সেটি ব্যবহার করবে, নয়তো ম্যানুয়াল টেক্সট
            let query = recordedSpeechText.trim() || userInputText.value.trim();
            query = query.toLowerCase();

            if (!query) return;

            let reply = "Sorry, I could not find an answer matching your query.";

            // সাধারণ প্রশ্নোত্তর লজিক
            if (query.includes("তুমি কে") || query.includes("who are you") || query.includes("তোমার নাম")) {
                reply = "I am the artificial intelligent created and presented by niloy";
            } else if (query.includes("হ্যালো") || query.includes("hello")) {
                reply = "Hello! How can I help you today?";
            }

            // আউটপুট দেখান ও ভয়েসে বলুন
            responseText.innerText = reply;
            botResponseArea.classList.remove('hidden');
            speakVoice(reply);

            // রিসেট
            recordedSpeechText = "";
        });
    </script>
</body>
</html>
