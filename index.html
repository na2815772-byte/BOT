<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হোম পেজ - ভয়েস ও বট সার্ভিস</title>
    <style>
        /* মূল স্টাইল ও কালার থিম */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* নেভিগেশন বার */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        /* থ্রি-ডট ড্রপডাউন মেনু */
        .menu-container {
            position: relative;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #f8fafc;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0 5px;
            transition: color 0.3s;
            line-height: 1;
        }

        .icon-btn:hover {
            color: #38bdf8;
        }

        .dropdown-content {
            position: absolute;
            left: 0;
            top: 130%;
            background-color: #1e293b;
            min-width: 170px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .dropdown-content a, .dropdown-item-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            color: #f8fafc;
            text-decoration: none;
            text-align: left;
            background: none;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .dropdown-content a:hover, .dropdown-item-btn:hover {
            background-color: #334155;
            color: #38bdf8;
        }

        /* বাটনের স্টাইল */
        .nav-link {
            color: #f8fafc;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #38bdf8;
        }

        .btn-primary-sm {
            background-color: #0284c7;
            padding: 8px 16px;
            border-radius: 6px;
            color: #fff !important;
            transition: background 0.3s;
        }

        .btn-primary-sm:hover {
            background-color: #0369a1;
        }

        .btn-large {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }

        .btn-action {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: #047857;
        }

        .btn-danger {
            background-color: #dc2626;
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }

        .btn-action:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-primary {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #0369a1;
        }

        /* মূল কনটেন্ট লেআউট */
        .main-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex-grow: 1;
        }

        .hero-card, .bot-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .hero-card h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        .hero-card p {
            color: #94a3b8;
            margin-bottom: 28px;
            font-size: 1.1rem;
        }

        .bot-card h2 {
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .record-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px;
            color: #f8fafc;
            font-size: 1rem;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        .response-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            border-radius: 4px;
            text-align: left;
        }

        .response-box h3 {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        /* হাইড করার ক্লাস */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <header class="navbar">
        <div class="nav-left">
            <!-- থ্রি-ডট আইকন ও ড্রপডাউন মেনু -->
            <div class="menu-container">
                <button id="menuBtn" class="icon-btn" aria-label="Menu">&#8942;</button>
                <div id="dropdownMenu" class="dropdown-content hidden">
                    <a href="#" id="helpCenterBtn">হেল্প সেন্টার</a>
                    <button id="logoutBtn" class="dropdown-item-btn">লগআউট</button>
                </div>
            </div>
            <span class="logo-text">মাই অ্যাপ</span>
        </div>
        <div class="nav-right">
            <a href="login.html" class="nav-link">লগইন</a>
            <a href="registration.html" class="nav-link btn-primary-sm">রেজিস্ট্রেশন</a>
        </div>
    </header>

    <!-- মূল কনটেন্ট -->
    <main class="main-container">
        
        <!-- গেট স্টার্টেড সেকশন -->
        <section id="heroSection" class="hero-card">
            <h1>স্বাগতম আমাদের প্ল্যাটফর্মে</h1>
            <p>শুরু করতে নিচের বাটনে ক্লিক করুন</p>
            <button id="getStartedBtn" class="btn-large">Get Started</button>
        </section>

        <!-- বট / রেকর্ড সেকশন (Get Started-এ ক্লিক করার পর দৃশ্যমান হবে) -->
        <section id="botSection" class="bot-card hidden">
            <h2>ভয়েস ও টেক্সট সহকারী</h2>
            
            <div class="record-controls">
                <button id="startRecordBtn" class="btn-action">Start Record</button>
                <button id="stopRecordBtn" class="btn-action btn-danger" disabled>Stop Record</button>
            </div>

            <div class="input-container">
                <textarea id="userInputText" placeholder="আপনার প্রশ্ন বা বার্তা এখানে লিখুন..." rows="4"></textarea>
                <button id="submitBtn" class="btn-primary">সাবমিট</button>
            </div>

            <!-- বটের রেসপন্স এলাকা -->
            <div id="botResponseArea" class="response-box hidden">
                <h3>উত্তর:</h3>
                <p id="responseText"></p>
            </div>
        </section>

    </main>

    <!-- জাভাস্ক্রিপ্ট ফাইল সংযোগ -->
    <script src="script.js"></script>
    <script src="index.js"></script>
</body>
</html>
