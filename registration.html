<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>রেজিস্ট্রেশন</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color: white;
}

.card {
    width: 92%;
    max-width: 450px;
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    border: 1px solid #334155;
}

h1 {
    text-align: center;
    color: #38bdf8;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 13px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #0284c7;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.message {
    text-align: center;
    margin-top: 15px;
}

.login {
    text-align: center;
    margin-top: 20px;
}

a {
    color: #38bdf8;
}

</style>

</head>

<body>

<div class="card">

    <h1>রেজিস্ট্রেশন</h1>

    <form id="registrationForm">

        <input
            type="text"
            id="firstName"
            placeholder="First Name"
            required>

        <input
            type="text"
            id="lastName"
            placeholder="Last Name"
            required>

        <input
            type="email"
            id="email"
            placeholder="Gmail / Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required>

        <button type="submit">
            SIGN UP
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login">

        আগে থেকেই অ্যাকাউন্ট আছে?

        <a href="login.html">
            লগইন
        </a>

    </div>

</div>


<script>

document
.getElementById("registrationForm")
.addEventListener("submit", function(e) {

    e.preventDefault();


    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    const message =
        document.getElementById("message");


    /*
     * PASSWORD RULES
     */

    const passwordOK =
        password.length >= 8 &&
        /[A-Z]/.test(password) &&
        /[a-z]/.test(password) &&
        /[0-9]/.test(password) &&
        /[^A-Za-z0-9]/.test(password);


    if (!passwordOK) {

        message.innerText =
            "Password-এ 8+ character, uppercase, lowercase, number এবং special character থাকতে হবে।";

        return;
    }


    if (password !== confirmPassword) {

        message.innerText =
            "Password মিলছে না।";

        return;
    }


    /*
     * USER SAVE
     */

    const user = {

        firstName: firstName,

        lastName: lastName,

        email: email,

        password: password

    };


    localStorage.setItem(
        "registeredUser",
        JSON.stringify(user)
    );


    /*
     * LOGIN STATUS
     */

    localStorage.setItem(
        "isLoggedIn",
        "true"
    );


    /*
     * HOME PAGE
     */

    window.location.href =
        "index.html";

});

</script>

</body>
</html>
